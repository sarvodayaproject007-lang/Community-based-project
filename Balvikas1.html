<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Community Sessions</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4FF;--card:#fff;--tx:#2D2A4A;--mu:#8A87A8;--soft:#EEEAFF;--row:#FBFAFF;--bd:#E6E2FA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17152B;--card:#221F3D;--tx:#ECEAFF;--mu:#A19EC4;--soft:#2E2A55;--row:#1D1A36;--bd:#3A3566}}
:root[data-theme="dark"]{--bg:#17152B;--card:#221F3D;--tx:#ECEAFF;--mu:#A19EC4;--soft:#2E2A55;--row:#1D1A36;--bd:#3A3566}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font-family:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:linear-gradient(170deg,#7C5CFF,#4B2FD6);color:#fff;padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 24px}
.logo{width:48px;height:48px;border-radius:16px;background:#FFD166;display:grid;place-items:center;font-size:24px;box-shadow:0 6px 0 #F4A300;flex-shrink:0}
.brand h1{font-size:19px;line-height:1.2}.brand small{opacity:.85;font-size:12px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{border:0;background:none;color:#fff;cursor:pointer;padding:12px 14px;border-radius:14px;font-weight:800;display:flex;gap:10px;align-items:center;opacity:.85;text-align:left;font-size:15px}
nav button:hover{background:rgba(255,255,255,.15)}nav button.on{background:#fff;color:#4B2FD6;opacity:1}
main{flex:1;padding:28px 32px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.topbar h2{font-size:28px}.topbar p,.muted{color:var(--mu);font-weight:600;font-size:14px}
.chip{background:var(--card);padding:8px 16px;border-radius:999px;font-weight:800;border:0;color:var(--tx);cursor:pointer}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 8px 24px rgba(124,92,255,.08);margin-bottom:20px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h3{font-size:18px}.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.grow{flex:1;min-width:0}
.empty{text-align:center;padding:36px;font-weight:700;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:4px;color:#2D2A4A}.stat span{font-size:28px}.stat b{font-size:30px}.stat small{font-weight:800;opacity:.8}
.pink{background:#FFE3EC}.mint{background:#D9F7F3}.yellow{background:#FFF1C9}.sky{background:#DDEEFF}
.btn{border:0;background:#7C5CFF;color:#fff;padding:11px 18px;border-radius:14px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #4B2FD6}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4B2FD6}
.btn.small{padding:7px 12px;font-size:13px;box-shadow:0 3px 0 #4B2FD6}.btn.ghost{background:var(--soft);color:#7C5CFF;box-shadow:none}
.btn.light{background:#fff;color:#FF6B9A;box-shadow:0 5px 0 #f0cad6}.btn.danger{background:#FF6B9A;box-shadow:0 5px 0 #C2185B}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
select,input,textarea{font-size:15px;padding:10px 12px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:100%;outline:none}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.toolbar select{width:auto;min-width:300px}
.seg{display:inline-flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:800;cursor:pointer;color:var(--mu)}.seg button.on{background:#7C5CFF;color:#fff}
.pill{background:var(--soft);color:#7C5CFF;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.status{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800}
.status.done{background:#D9F7F3;color:#0E8C7F}.status.pending{background:#FFF1C9;color:#9A6B00}.status.upcoming{background:#E4E0FF;color:#4B2FD6}
.tag{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#2EC4B6,#7C5CFF)}.bar.big{height:16px;margin:10px 0}
.warn{color:#FF6B9A}
.chart{display:flex;align-items:flex-end;gap:14px;height:220px}.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}.bar-v{width:100%;max-width:56px;border-radius:14px 14px 6px 6px;background:linear-gradient(#7C5CFF,#2EC4B6)}
.next{background:linear-gradient(135deg,#FF8A5B,#FF6B9A);color:#fff}.next .muted{color:rgba(255,255,255,.92)}.next h2{margin:6px 0}
.row{display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;background:var(--row);margin-bottom:10px;flex-wrap:wrap}.row small{color:var(--mu);display:block;font-weight:600}
.avatar{width:44px;height:44px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:900;flex-shrink:0}
.counts span{padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;margin-left:6px}
.c-p{background:#D9F7F3;color:#0E8C7F}.c-l{background:#FFF1C9;color:#9A6B00}.c-a{background:#FFE3EC;color:#C2185B}
.marks{display:flex;gap:8px;flex-wrap:wrap}.mk{border:2px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:999px;font-weight:800;cursor:pointer;color:var(--mu)}
.mk.on.p{background:#2EC4B6;border-color:#2EC4B6;color:#fff}.mk.on.l{background:#F4A300;border-color:#F4A300;color:#fff}.mk.on.a{background:#FF6B9A;border-color:#FF6B9A;color:#fff}
.foot{display:flex;gap:14px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:12px;padding-top:16px;border-top:2px dashed var(--soft)}
.check{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;color:var(--mu)}.check input{width:auto}
.session{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;flex-wrap:wrap}
.date-box{width:66px;height:66px;border-radius:18px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7C5CFF;flex-shrink:0}.date-box b{font-size:24px;line-height:1}.date-box span{font-size:12px;font-weight:800;text-transform:uppercase}
.act{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;background:var(--card);margin-bottom:12px}.act.done{opacity:.55}
.act-icon{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:22px;background:#FFF1C9;flex-shrink:0}.act p{font-size:14px;color:var(--mu);margin-top:6px;font-weight:600}
.ib{display:flex;gap:4px}.ib button{border:0;background:var(--soft);color:var(--tx);width:34px;height:34px;border-radius:10px;cursor:pointer}
.idea{border:0;background:var(--row);color:var(--tx);width:100%;display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;margin-bottom:8px;cursor:pointer;text-align:left;font-size:20px}
.idea b{font-size:15px;display:block}.idea small{color:var(--mu);font-size:13px;font-weight:700}
.notif{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--row);margin-bottom:10px}.n-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.n-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notif p{font-size:14px;margin:6px 0;font-weight:600;line-height:1.5;white-space:pre-wrap}
.preview{background:var(--row);border-radius:16px;padding:18px;line-height:1.6;font-weight:600;border:2px dashed var(--bd);white-space:pre-wrap}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--soft);vertical-align:top}th{color:var(--mu);font-size:12px;text-transform:uppercase}
.modal-bg{position:fixed;inset:0;background:rgba(20,18,40,.55);display:none;place-items:center;z-index:50;padding:16px}.modal-bg.show{display:grid}
.modal{background:var(--card);border-radius:24px;padding:24px;width:min(500px,100%);max-height:90vh;overflow:auto}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mh button{border:0;background:var(--soft);color:var(--tx);width:34px;height:34px;border-radius:50%;cursor:pointer}
label{display:block;font-weight:800;font-size:14px;margin-bottom:12px;color:var(--mu)}label input,label select,label textarea{margin-top:6px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(140px);background:#2D2A4A;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;transition:transform .3s;z-index:60}#toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.app{flex-direction:column}.sidebar{width:100%;height:auto;position:static;padding:14px}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}.grid-2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}main{padding:18px}.toolbar select{min-width:0;width:100%}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">🌼</div><div><h1 id="bOrg"></h1><small id="bCenter"></small></div></div><nav id="nav"></nav></aside>
<main><header class="topbar"><div><h2 id="pTitle"></h2><p id="pSub"></p></div><button class="chip" id="chip" onclick="go('settings')"></button></header><section id="view"></section></main></div>
<div class="modal-bg" id="modal"><div class="modal"><div class="mh"><h3 id="mTitle"></h3><button onclick="closeModal()">✕</button></div><div id="mBody"></div></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
const isoD=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const todayISO=()=>isoD(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return isoD(d)};
const fmtDate=i=>new Date(i+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const shortDate=i=>new Date(i+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const COLORS=['#7C5CFF','#FF6B9A','#2EC4B6','#FF8A5B','#F4A300','#4CC9F0'];
const colorOf=id=>COLORS[id%COLORS.length];
const initials=n=>n.split(' ').filter(Boolean).map(p=>p[0]).slice(0,2).join('').toUpperCase();
const byDate=(a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time);
const attended=s=>s==='present'||s==='late';
const TYPES={story:['📖','Story'],song:['🎵','Song / Music'],game:['🎲','Game'],craft:['🎨','Craft'],talk:['💡','Group Talk'],calm:['🧘','Quiet Time'],drama:['🎭','Drama'],quiz:['❓','Quiz']};
const TM={absence:['❌','Absent','#FF6B9A'],late:['⏰','Late','#F4A300'],topic:['📣','Next topic','#7C5CFF'],alert:['📉','Attendance alert','#2EC4B6']};
const BANK=[{type:'story',title:'Story Time',minutes:15,materials:'Picture cards'},{type:'song',title:'Group Singing',minutes:10,materials:'Speaker'},{type:'game',title:'Relay Race',minutes:15,materials:'Cones'},{type:'craft',title:'Card Making',minutes:20,materials:'Paper, glue, pens'},{type:'talk',title:'Circle Talk',minutes:15,materials:'None'},{type:'calm',title:'Silent Minute',minutes:5,materials:'Soft music'},{type:'drama',title:'Role Play',minutes:15,materials:'Props box'},{type:'quiz',title:'Quick Quiz',minutes:10,materials:'Question cards'}];
const NAV=[['dashboard','🏠','Dashboard'],['people','👨‍👩‍👧','People'],['sessions','📅','Sessions'],['attendance','✅','Attendance'],['notifications','🔔','Parent Messages'],['planner','🧩','Activity Planner'],['settings','⚙️','Settings']];
const KEY='community-sessions-v1';
const blank=()=>({settings:{org:'',center:'',user:'',low:75,g1:8,g2:11},teachers:[],kids:[],sessions:[],activities:[],notifications:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=Object.assign(blank(),db||{});db.settings=Object.assign(blank().settings,db.settings||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
let view='dashboard',nTab='alerts',pTab='kids',attS=null,attG='All',autoN=true,planS=null,draft={sid:null,marks:{}};
const groupOf=a=>a<=db.settings.g1?'Group I':a<=db.settings.g2?'Group II':'Group III';
const sorted=()=>[...db.sessions].sort(byDate);
const findS=id=>db.sessions.find(s=>s.id===id);
const statusOf=s=>s.attendance?'done':(s.date<todayISO()?'pending':'upcoming');
const upcoming=()=>sorted().filter(s=>statusOf(s)==='upcoming');
const doneS=()=>db.sessions.filter(s=>s.attendance);
const pct=s=>{const m=db.kids.filter(k=>s.attendance[k.id]);return Math.round(m.filter(k=>attended(s.attendance[k.id])).length/(m.length||1)*100)};
const kStats=()=>{const d=doneS();return db.kids.map(k=>{const t=d.filter(s=>s.attendance[k.id]);const a=t.filter(s=>attended(s.attendance[k.id])).length;return{...k,total:t.length,attended:a,pct:t.length?Math.round(a/t.length*100):100}})};
const lowKids=()=>kStats().filter(k=>k.total&&k.pct<db.settings.low);
const timeAgo=i=>{const m=Math.round((Date.now()-new Date(i))/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':shortDate(isoD(new Date(i)))};
const badge=t=>`<span class="tag" style="background:${TM[t][2]}22;color:${TM[t][2]}">${TM[t][0]} ${TM[t][1]}</span>`;
const empty=m=>`<div class="card empty"><p>${m}</p></div>`;
const orgName=()=>db.settings.org||'Community Sessions';
function tsel(v){const n=[...new Set([...db.teachers.map(t=>t.name),v].filter(Boolean))];return n.length?`<select name="teacher">${n.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input name="teacher" placeholder="Teacher name">`}
function go(v,t){view=v;if(v==='notifications'&&t)nTab=t;render()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(title,body,onSubmit,label='Save'){$('#mTitle').textContent=title;$('#mBody').innerHTML=`<form id="mForm">${body}<div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">${label}</button></div></form>`;$('#mForm').onsubmit=e=>{e.preventDefault();onSubmit(Object.fromEntries(new FormData(e.target)))};$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function confirmDo(msg,fn,label='Delete'){openModal('Are you sure?',`<p class="muted" style="margin-bottom:16px">${msg}</p>`,()=>{fn();save();closeModal();render()},label)}
function addNotif(type,k,message,sid=null){db.notifications.unshift({id:uid(),type,kidId:k.id,kidName:k.name,parent:k.parent,phone:k.phone,message,sessionId:sid,sentAt:new Date().toISOString()})}
/* People */
function kidModal(id){const k=db.kids.find(x=>x.id===id)||{};openModal(id?'Edit child':'Add child',`<label>Child name<input name="name" required value="${esc(k.name)}"></label><div class="two"><label>Age<input type="number" name="age" min="1" max="30" required value="${esc(k.age??'')}"></label><label>Parent / guardian<input name="parent" required value="${esc(k.parent)}"></label></div><label>Parent phone<input name="phone" type="tel" value="${esc(k.phone)}"></label>`,d=>{const o={name:d.name.trim(),age:+d.age,parent:d.parent.trim(),phone:d.phone.trim()};if(id)Object.assign(k,o);else db.kids.push({id:uid(),...o});save();closeModal();toast(id?'Child updated':'Child added');render()})}
function teacherModal(id){const t=db.teachers.find(x=>x.id===id)||{};openModal(id?'Edit teacher':'Add teacher',`<label>Name<input name="name" required value="${esc(t.name)}"></label><label>Phone (optional)<input name="phone" type="tel" value="${esc(t.phone)}"></label>`,d=>{if(id){db.sessions.concat(db.activities).forEach(x=>{if(x.teacher===t.name)x.teacher=d.name.trim()});t.name=d.name.trim();t.phone=d.phone.trim()}else db.teachers.push({id:uid(),name:d.name.trim(),phone:d.phone.trim()});save();closeModal();toast(id?'Teacher updated':'Teacher added');render()})}
const delKid=id=>confirmDo('Remove this child from the community? Past attendance counts will no longer include them.',()=>{db.kids=db.kids.filter(k=>k.id!==id)});
const delTeacher=id=>confirmDo('Remove this teacher? Their past sessions keep the name.',()=>{db.teachers=db.teachers.filter(t=>t.id!==id)});
/* Sessions */
function sessionModal(id){const s=findS(id)||{date:addDays(7),time:'09:00',duration:90,topic:'',teacher:db.settings.user};openModal(id?'Edit session':'New session',`<div class="two"><label>Date<input type="date" name="date" required value="${s.date}"></label><label>Time<input type="time" name="time" required value="${s.time}"></label></div><label>Topic<input name="topic" required value="${esc(s.topic)}" placeholder="e.g. Kindness"></label><label>Teacher${tsel(s.teacher)}</label><label>Duration (minutes)<input type="number" name="duration" min="10" required value="${s.duration}"></label>`,d=>{const o={date:d.date,time:d.time,topic:d.topic.trim(),teacher:d.teacher||'',duration:+d.duration};if(id)Object.assign(s,o);else db.sessions.push({id:uid(),...o});save();closeModal();toast(id?'Session updated':'Session created');render()})}
const delSession=id=>confirmDo('Delete this session, its attendance and planned activities?',()=>{db.sessions=db.sessions.filter(s=>s.id!==id);db.activities=db.activities.filter(a=>a.sessionId!==id)});
/* Attendance */
function mark(k,st){draft.marks[k]=st;render()}
function markAll(st){db.kids.forEach(k=>draft.marks[k.id]=st);render()}
function saveAtt(){const s=findS(attS);const miss=db.kids.filter(k=>!draft.marks[k.id]);if(miss.length){toast(`Please mark ${miss.length} remaining child(ren)`);return}
s.attendance={...draft.marks};db.notifications=db.notifications.filter(n=>!(n.sessionId===s.id&&(n.type==='absence'||n.type==='late')));
if(autoN)db.kids.forEach(k=>{const st=s.attendance[k.id];if(st==='absent')addNotif('absence',k,`Hello ${k.parent}, ${k.name} was absent on ${fmtDate(s.date)} (topic: "${s.topic}"). We missed them! Please encourage them to join the next session.`,s.id);if(st==='late')addNotif('late',k,`Hello ${k.parent}, ${k.name} arrived late on ${fmtDate(s.date)}. Sessions begin at ${s.time}; please help them arrive on time.`,s.id)});
save();toast('Attendance saved'+(autoN?' & parents notified':''));render()}
/* Messages */
const lowMsg=k=>`Hello ${k.parent}, ${k.name}'s attendance is ${k.pct}% so far. Regular attendance helps children get the most from our sessions. Kindly encourage them to attend. Thank you!`;
const topicMsg=(p,d,t,topic,note)=>`Hello ${p},\nNext session: ${fmtDate(d)} at ${t}\nTopic: "${topic}"\n${note?note+'\n':''}Please send your child on time. Thank you!`;
function sendLow(id){const k=kStats().find(x=>x.id===id);addNotif('alert',k,lowMsg(k));save();toast('Reminder sent to '+k.parent);render()}
function sendAllLow(){const l=lowKids();l.forEach(k=>addNotif('alert',k,lowMsg(k)));save();toast(`Reminders sent to ${l.length} parents`);render()}
function broadcast(id,aud='all'){const s=findS(id);const ks=db.kids.filter(k=>aud==='all'||groupOf(k.age)===aud);if(!ks.length){toast('No children to notify yet');return}ks.forEach(k=>addNotif('topic',k,topicMsg(k.parent,s.date,s.time,s.topic,s.topicNote),s.id));save();toast(`Topic sent to ${ks.length} parents`);render()}
function sendTopic(e){e.preventDefault();const f=e.target,s=findS(+f.session.value);s.topic=f.topic.value.trim();s.topicNote=f.note.value.trim();broadcast(s.id,f.aud.value)}
function prevTopic(f){const s=findS(+f.session.value);$('#preview').textContent=topicMsg('Parent',s.date,s.time,f.topic.value,f.note.value)}
/* Activities */
function actModal(i,eid){const e=db.activities.find(a=>a.id===eid);const p=e||(i!==undefined?BANK[i]:{type:'story',minutes:15});openModal(e?'Edit activity':'Plan an activity',`<label>Title<input name="title" required value="${esc(p.title)}"></label><div class="two"><label>Type<select name="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===p.type?'selected':''}>${v[0]} ${v[1]}</option>`).join('')}</select></label><label>Minutes<input type="number" name="minutes" min="1" required value="${p.minutes||15}"></label></div><label>Teacher${tsel(p.teacher||db.settings.user)}</label><label>Materials<input name="materials" value="${esc(p.materials)}"></label><label>Steps / description<textarea name="description" rows="3">${esc(p.description)}</textarea></label>`,d=>{const o={title:d.title.trim(),type:d.type,minutes:+d.minutes,teacher:d.teacher||'',materials:d.materials,description:d.description};if(e)Object.assign(e,o);else db.activities.push({id:uid(),sessionId:planS,done:false,...o});save();closeModal();toast('Activity saved');render()})}
const toggleAct=id=>{const a=db.activities.find(x=>x.id===id);a.done=!a.done;save();render()};
const delAct=id=>{db.activities=db.activities.filter(a=>a.id!==id);save();render()};
function moveAct(id,dir){const sid=db.activities.find(a=>a.id===id).sessionId;const same=db.activities.map((a,i)=>[a,i]).filter(([a])=>a.sessionId===sid);const p=same.findIndex(([a])=>a.id===id),q=p+dir;if(q<0||q>=same.length)return;const a=same[p][1],b=same[q][1];[db.activities[a],db.activities[b]]=[db.activities[b],db.activities[a]];save();render()}
/* Views */
function feed(l){return l.length?l.slice(0,25).map(n=>`<div class="notif"><div class="n-ic" style="background:${TM[n.type][2]}22">${TM[n.type][0]}</div><div class="grow"><div class="n-top"><b>To: ${esc(n.parent)}</b><small class="muted">re: ${esc(n.kidName)}</small>${badge(n.type)}</div><p>${esc(n.message)}</p><small class="muted">${n.phone?'📱 '+esc(n.phone)+' · ':''}${timeAgo(n.sentAt)}</small></div></div>`).join(''):'<p class="muted">No messages yet.</p>'}
function vDashboard(){const done=doneS(),avg=done.length?Math.round(done.reduce((a,s)=>a+pct(s),0)/done.length):0,next=upcoming()[0],pend=db.sessions.filter(s=>statusOf(s)==='pending'),low=lowKids(),na=next?db.activities.filter(a=>a.sessionId===next.id):[];
const todo=[];if(!db.kids.length)todo.push(['👨‍👩‍👧','Add the children in your community','people']);if(!db.sessions.length)todo.push(['📅','Create your first session','sessions']);if(pend.length)todo.push(['✅',`${pend.length} session(s) waiting for attendance`,'attendance']);if(low.length)todo.push(['📉',`${low.length} child(ren) below ${db.settings.low}% attendance`,'notifications']);if(next&&!na.length)todo.push(['🧩',`No activities planned for ${shortDate(next.date)}`,'planner']);
return `<div class="stats"><div class="stat pink"><span>🧒</span><b>${db.kids.length}</b><small>Children enrolled</small></div><div class="stat mint"><span>📚</span><b>${done.length}</b><small>Sessions completed</small></div><div class="stat yellow"><span>📈</span><b>${done.length?avg+'%':'–'}</b><small>Average attendance</small></div><div class="stat sky"><span>💌</span><b>${db.notifications.length}</b><small>Parent messages sent</small></div></div>
<div class="grid-2"><div class="card"><div class="head"><h3>Attendance trend</h3><span class="pill">Last ${Math.min(done.length,6)} sessions</span></div><div class="chart">${sorted().filter(s=>s.attendance).slice(-6).map(s=>`<div class="col"><b style="font-size:13px">${pct(s)}%</b><div class="bar-v" style="height:${Math.max(pct(s),4)}%"></div><small class="muted">${shortDate(s.date)}</small></div>`).join('')||'<p class="muted">No completed sessions yet.</p>'}</div></div>
<div class="card next">${next?`<small>⭐ NEXT SESSION</small><h2>${esc(next.topic)}</h2><p class="muted">📅 ${fmtDate(next.date)} · 🕘 ${next.time}${next.teacher?' · 👩‍🏫 '+esc(next.teacher):''}</p><p class="muted">🧩 ${na.length} activities planned</p><div class="btns"><button class="btn light" onclick="broadcast(${next.id})">📣 Notify all parents</button><button class="btn ghost" onclick="go('notifications','topic')">Edit topic</button></div>`:`<h3>No upcoming session</h3><p class="muted" style="margin:8px 0 14px">Create the next session to get started.</p><button class="btn light" onclick="sessionModal()">＋ Create session</button>`}</div></div>
<div class="grid-2"><div class="card"><div class="head"><h3>📝 To-do</h3></div>${todo.map(([i,t,v])=>`<div class="row"><span style="font-size:22px">${i}</span><div class="grow"><b>${t}</b></div><button class="btn small" onclick="go('${v}')">Open</button></div>`).join('')||'<p class="muted">All caught up 🎉</p>'}</div>
<div class="card"><div class="head"><h3>Recent parent messages</h3><button class="btn small ghost" onclick="go('notifications','log')">View all</button></div>${feed(db.notifications.slice(0,3))}</div></div>`}
function vPeople(){const kids=pTab==='kids';const list=kids?[...db.kids].sort((a,b)=>a.name.localeCompare(b.name)):[...db.teachers].sort((a,b)=>a.name.localeCompare(b.name));
return `<div class="toolbar"><div class="seg"><button class="${kids?'on':''}" onclick="pTab='kids';render()">🧒 Children (${db.kids.length})</button><button class="${!kids?'on':''}" onclick="pTab='teachers';render()">👩‍🏫 Teachers (${db.teachers.length})</button></div><button class="btn" onclick="${kids?'kidModal()':'teacherModal()'}">＋ Add ${kids?'child':'teacher'}</button></div>
${list.length?`<div class="card">${list.map(p=>`<div class="row"><div class="avatar" style="background:${colorOf(p.id)}">${esc(initials(p.name))}</div><div class="grow"><b>${esc(p.name)}</b><small>${kids?`Age ${p.age} · ${groupOf(p.age)} · Parent: ${esc(p.parent)}${p.phone?' · '+esc(p.phone):''}`:esc(p.phone||'No phone added')}</small></div><div class="ib"><button title="Edit" onclick="${kids?'kidModal':'teacherModal'}(${p.id})">✏️</button><button title="Delete" onclick="${kids?'delKid':'delTeacher'}(${p.id})">🗑️</button></div></div>`).join('')}</div>`:empty(`No ${kids?'children':'teachers'} yet. Use “Add ${kids?'child':'teacher'}” to build your community.`)}`}
function vSessions(){const head=`<div class="toolbar"><div><h3>All sessions</h3><small class="muted">${db.sessions.length} sessions</small></div><button class="btn" onclick="sessionModal()">＋ New session</button></div>`;if(!db.sessions.length)return head+empty('No sessions yet.');
return head+sorted().map(s=>{const st=statusOf(s),d=new Date(s.date+'T00:00');return `<div class="session"><div class="date-box"><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-IN',{month:'short'})}</span></div><div class="grow"><h3>${esc(s.topic)}</h3><p class="muted">🕘 ${s.time} · ⏱ ${s.duration} min${s.teacher?' · 👩‍🏫 '+esc(s.teacher):''}</p>${st==='done'?`<div class="bar" style="margin-top:8px;max-width:320px"><span style="width:${pct(s)}%"></span></div><small class="muted">${pct(s)}% attended</small>`:''}</div><span class="status ${st}">${{done:'Completed',pending:'Attendance pending',upcoming:'Upcoming'}[st]}</span><div class="btns" style="margin-top:0"><button class="btn small" onclick="attS=${s.id};go('attendance')">✅ Attendance</button><button class="btn small ghost" onclick="planS=${s.id};go('planner')">🧩 Plan</button><div class="ib"><button title="Edit" onclick="sessionModal(${s.id})">✏️</button><button title="Delete" onclick="delSession(${s.id})">🗑️</button></div></div></div>`}).join('')}
function vAttendance(){if(!db.sessions.length)return empty('Create a session first to take attendance.');if(!db.kids.length)return empty('Add children in the People page first.');
const l=sorted();if(!findS(attS))attS=(l.find(s=>statusOf(s)==='pending')||l.find(s=>statusOf(s)==='upcoming')||l[0]).id;const s=findS(attS);if(draft.sid!==s.id)draft={sid:s.id,marks:{...(s.attendance||{})}};
const kids=db.kids.filter(k=>attG==='All'||groupOf(k.age)===attG),c={present:0,late:0,absent:0};db.kids.forEach(k=>{const m=draft.marks[k.id];if(m)c[m]++});
const mk=(k,st,lb,cl)=>`<button class="mk ${cl}${draft.marks[k.id]===st?' on':''}" onclick="mark(${k.id},'${st}')">${lb}</button>`;
return `<div class="toolbar"><select onchange="attS=+this.value;render()">${l.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${fmtDate(x.date)} · ${esc(x.topic)}</option>`).join('')}</select><div class="seg">${['All','Group I','Group II','Group III'].map(g=>`<button class="${attG===g?'on':''}" onclick="attG='${g}';render()">${g}</button>`).join('')}</div></div>
<div class="card"><div class="head"><div><h3>${esc(s.topic)}</h3><small class="muted">${fmtDate(s.date)} · ${s.time}</small></div><div class="counts"><span class="c-p">✅ ${c.present}</span><span class="c-l">⏰ ${c.late}</span><span class="c-a">❌ ${c.absent}</span></div></div>
${kids.map(k=>`<div class="row"><div class="avatar" style="background:${colorOf(k.id)}">${esc(initials(k.name))}</div><div class="grow"><b>${esc(k.name)}</b><small>Age ${k.age} · ${groupOf(k.age)} · Parent: ${esc(k.parent)}</small></div><div class="marks">${mk(k,'present','✅ Present','p')}${mk(k,'late','⏰ Late','l')}${mk(k,'absent','❌ Absent','a')}</div></div>`).join('')||'<p class="muted">No children in this group.</p>'}
<div class="foot"><button class="btn ghost small" onclick="markAll('present')">Mark all present</button><label class="check" style="margin:0"><input type="checkbox" ${autoN?'checked':''} onchange="autoN=this.checked">Auto-notify parents on absence / late</label><button class="btn" onclick="saveAtt()">💾 Save attendance</button></div></div>`}
function alertsTab(){const low=lowKids();return `<div class="card"><div class="head"><div><h3>📉 Low attendance (below ${db.settings.low}%)</h3><small class="muted">Send a friendly reminder to parents of children falling behind</small></div>${low.length?`<button class="btn small" onclick="sendAllLow()">Remind all (${low.length})</button>`:''}</div>${low.map(k=>`<div class="row"><div class="avatar" style="background:${colorOf(k.id)}">${esc(initials(k.name))}</div><div class="grow"><b>${esc(k.name)}</b><small>${k.attended}/${k.total} sessions · Parent: ${esc(k.parent)}</small></div><span class="pill">${k.pct}%</span><button class="btn small ghost" onclick="sendLow(${k.id})">Send reminder</button></div>`).join('')||'<p class="muted">Nobody is below the threshold 🎉</p>'}</div><div class="card"><h3>🔔 Automatic alerts (absent / late)</h3><p class="muted" style="margin:4px 0 14px">Sent when attendance is saved.</p>${feed(db.notifications.filter(n=>n.type==='absence'||n.type==='late'))}</div>`}
function topicTab(){const up=upcoming();if(!up.length)return empty('No upcoming sessions. Create one on the Sessions page.');const s=up[0];
return `<div class="grid-2"><div class="card"><h3 style="margin-bottom:14px">📣 Announce next session topic</h3><form onsubmit="sendTopic(event)" oninput="prevTopic(this)"><label>Session<select name="session">${up.map(x=>`<option value="${x.id}">${fmtDate(x.date)} · ${esc(x.topic)}</option>`).join('')}</select></label><label>Topic<input name="topic" required value="${esc(s.topic)}"></label><label>Note for parents / what to bring<textarea name="note" rows="3">${esc(s.topicNote||'')}</textarea></label><label>Send to<select name="aud"><option value="all">All parents (${db.kids.length})</option>${['Group I','Group II','Group III'].map(g=>`<option value="${g}">${g} parents (${db.kids.filter(k=>groupOf(k.age)===g).length})</option>`).join('')}</select></label><button class="btn">📣 Send to parents</button></form></div><div class="card"><h3 style="margin-bottom:14px">Message preview</h3><div class="preview" id="preview">${esc(topicMsg('Parent',s.date,s.time,s.topic,s.topicNote))}</div></div></div>`}
function logTab(){return `<div class="card tw"><table><tr><th>When</th><th>Type</th><th>Parent</th><th>Child</th><th>Message</th></tr>${db.notifications.map(n=>`<tr><td>${timeAgo(n.sentAt)}</td><td>${badge(n.type)}</td><td>${esc(n.parent)}</td><td>${esc(n.kidName)}</td><td style="max-width:340px">${esc(n.message)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No messages sent yet.</td></tr>'}</table></div>`}
function vNotifications(){const t=[['alerts','🚨 Attendance alerts'],['topic','📣 Next session topic'],['log','📜 Sent log']];return `<div class="seg" style="margin-bottom:20px">${t.map(([k,l])=>`<button class="${nTab===k?'on':''}" onclick="nTab='${k}';render()">${l}</button>`).join('')}</div>${nTab==='alerts'?alertsTab():nTab==='topic'?topicTab():logTab()}`}
function vPlanner(){if(!db.sessions.length)return empty('Create a session first to plan activities.');const l=sorted();if(!findS(planS))planS=(l.find(s=>statusOf(s)==='upcoming')||l[0]).id;const s=findS(planS),acts=db.activities.filter(a=>a.sessionId===s.id),pl=acts.reduce((t,a)=>t+a.minutes,0),over=pl>s.duration;
return `<div class="toolbar"><select onchange="planS=+this.value;render()">${l.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${fmtDate(x.date)} · ${esc(x.topic)}</option>`).join('')}</select><button class="btn" onclick="actModal()">＋ Add activity</button></div>
<div class="grid-2"><div><div class="card"><h3>${esc(s.topic)}</h3><p class="muted">${fmtDate(s.date)} · ${s.time}</p><div class="head" style="margin:12px 0 0;font-weight:800"><span>${pl} / ${s.duration} min planned</span><span class="${over?'warn':''}">${over?'⚠️ Over time, trim an activity':'✨ Timing looks good'}</span></div><div class="bar big"><span style="width:${Math.min(100,Math.round(pl/s.duration*100))}%;${over?'background:#FF6B9A':''}"></span></div></div>
${acts.map((a,i)=>`<div class="act ${a.done?'done':''}"><div class="act-icon">${TYPES[a.type][0]}</div><div class="grow"><b>${i+1}. ${esc(a.title)}</b> <span class="pill">${a.minutes} min</span><small class="muted" style="display:block;margin-top:2px">${TYPES[a.type][1]}${a.teacher?' · 👩‍🏫 '+esc(a.teacher):''} · 🧺 ${esc(a.materials||'—')}</small>${a.description?`<p>${esc(a.description)}</p>`:''}</div><div class="ib"><button title="Done" onclick="toggleAct(${a.id})">${a.done?'✅':'⬜'}</button><button title="Edit" onclick="actModal(undefined,${a.id})">✏️</button><button onclick="moveAct(${a.id},-1)">↑</button><button onclick="moveAct(${a.id},1)">↓</button><button title="Delete" onclick="delAct(${a.id})">🗑️</button></div></div>`).join('')||empty('No activities yet. Add one, or pick from the idea bank.')}</div>
<div class="card"><h3>💡 Idea bank</h3><p class="muted" style="margin:4px 0 14px">Tap an idea to add it to this session.</p>${BANK.map((t,i)=>`<button class="idea" onclick="actModal(${i})"><span>${TYPES[t.type][0]}</span><div><b>${esc(t.title)}</b><small>${TYPES[t.type][1]} · ${t.minutes} min</small></div></button>`).join('')}</div></div>`}
function vSettings(){const s=db.settings;return `<div class="card" style="max-width:560px"><h3 style="margin-bottom:14px">Community settings</h3><form onsubmit="saveSettings(event)"><label>Community / programme name<input name="org" value="${esc(s.org)}" placeholder="e.g. Sunday Kids Club"></label><label>Centre / location<input name="center" value="${esc(s.center)}" placeholder="e.g. Community Hall"></label><label>Your name (shown top right)<input name="user" value="${esc(s.user)}"></label><label>Low-attendance alert below (%)<input type="number" name="low" min="1" max="100" value="${s.low}"></label><div class="two"><label>Group I up to age<input type="number" name="g1" min="1" value="${s.g1}"></label><label>Group II up to age<input type="number" name="g2" min="1" value="${s.g2}"></label></div><button class="btn">Save settings</button></form></div>
<div class="card" style="max-width:560px"><h3>Reset</h3><p class="muted" style="margin:6px 0 12px">Erase every child, teacher, session and message stored in this browser.</p><button class="btn danger small" onclick="confirmDo('This permanently erases all data on this device.',()=>{db=blank()},'Erase everything')">Erase all data</button></div>`}
function saveSettings(e){e.preventDefault();const f=e.target;Object.assign(db.settings,{org:f.org.value.trim(),center:f.center.value.trim(),user:f.user.value.trim(),low:+f.low.value||75,g1:+f.g1.value||8,g2:Math.max(+f.g2.value||11,+f.g1.value||8)});save();toast('Settings saved');render()}
const V={dashboard:vDashboard,people:vPeople,sessions:vSessions,attendance:vAttendance,notifications:vNotifications,planner:vPlanner,settings:vSettings};
const T={dashboard:['Dashboard','Here is what is happening in your community 🌸'],people:['People','Add and edit children and teachers'],sessions:['Sessions','Schedule, track and open every session'],attendance:['Session Attendance','Mark each child as present, late or absent'],notifications:['Parent Messages','Keep parents informed'],planner:['Activity Planner','Plan fun activities for every session'],settings:['Settings','Make this app your own']};
function render(){$('#bOrg').textContent=orgName();$('#bCenter').textContent=db.settings.center||'Tap Settings to personalise';$('#chip').textContent='👩‍🏫 '+(db.settings.user||'Set your name');document.title=orgName();
$('#nav').innerHTML=NAV.map(([v,i,l])=>`<button class="${view===v?'on':''}" onclick="go('${v}')"><span>${i}</span>${l}</button>`).join('');
$('#pTitle').textContent=T[view][0];$('#pSub').textContent=T[view][1];$('#view').innerHTML=V[view]()}
render();
</script></body></html>
